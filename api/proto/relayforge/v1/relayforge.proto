syntax = "proto3";

// RelayForge v1 wire API. Unary RPCs over gRPC; see docs/PROTOCOL.md for
// semantics, status-code mapping, and the additive-evolution policy.
package relayforge.v1;

option go_package = "relayforge/api/proto/relayforge/v1;relayforgev1";

// AckMode selects the durability promise made before Produce returns.
// Mapping to the storage ladder is documented in docs/GUARANTEES.md.
enum AckMode {
  ACK_MODE_UNSPECIFIED = 0; // defaults to ACK_MODE_WRITTEN
  ACK_MODE_NONE = 1;        // no durability promise
  ACK_MODE_WRITTEN = 2;     // survives process crash (page cache)
  ACK_MODE_FLUSHED = 3;     // fsync completed before the ack
}

message Message {
  bytes key = 1;   // optional
  bytes value = 2; // required (may be empty bytes, not absent)
}

message ProduceRequest {
  string topic = 1;
  int32 partition = 2;
  AckMode ack_mode = 3;
  repeated Message messages = 4;
}

message ProduceResponse {
  // One offset per message, in request order. When the RPC fails partway,
  // the error is returned and the response is not delivered: records
  // already appended are visible to consumers but their offsets were never
  // acknowledged (at-least-once on producer retry).
  repeated uint64 offsets = 1;
}

message FetchRequest {
  string topic = 1;
  int32 partition = 2;
  // Offset to start reading from. Reading exactly at high_watermark waits
  // up to max_wait_ms for new data (long poll); an offset beyond
  // high_watermark fails with OUT_OF_RANGE.
  uint64 offset = 3;
  int32 max_bytes = 4;    // <= 0 selects the server default
  int32 max_wait_ms = 5;  // long-poll window when no data is available
}

message FetchedRecord {
  uint64 offset = 1;
  bytes key = 2;
  bytes value = 3;
  int64 timestamp_ms = 4;
}

message FetchResponse {
  repeated FetchedRecord records = 1;
  // Offset just past the last returned record; resume reads from here.
  uint64 next_offset = 2;
  // The log end at response time: the offset the next produced record
  // will receive.
  uint64 high_watermark = 3;
}

service RelayForge {
  rpc Produce(ProduceRequest) returns (ProduceResponse);
  rpc Fetch(FetchRequest) returns (FetchResponse);
  rpc CreateTopic(CreateTopicRequest) returns (CreateTopicResponse);
  rpc ListTopics(ListTopicsRequest) returns (ListTopicsResponse);
  rpc DescribeTopic(DescribeTopicRequest) returns (DescribeTopicResponse);
  rpc JoinGroup(JoinGroupRequest) returns (JoinGroupResponse);
  rpc SyncGroup(SyncGroupRequest) returns (SyncGroupResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc CommitOffset(CommitOffsetRequest) returns (CommitOffsetResponse);
  rpc GetOffsets(GetOffsetsRequest) returns (GetOffsetsResponse);
  rpc DescribeGroup(DescribeGroupRequest) returns (DescribeGroupResponse);
}

// --- Consumer groups (Phase 7) ---
//
// Simplified protocol (docs/GUARANTEES.md): members join with an empty
// member_id (the broker assigns one; re-join with the previously assigned
// id), the broker computes balanced assignments at join/rebalance time,
// and generation fencing rejects commits from stale members — a fenced
// member must re-join. Membership ends via session timeout.

message JoinGroupRequest {
  string group = 1;
  string member_id = 2;           // empty = new member
  string topic = 3;               // single-topic subscription (MVP)
  int32 session_timeout_ms = 4;   // membership ends after this without a heartbeat
}

message JoinGroupResponse {
  int64 generation_id = 1;
  string member_id = 2;
}

message PartitionAssignment {
  string topic = 1;
  repeated int32 partitions = 2;
}

message SyncGroupRequest {
  string group = 1;
  int64 generation_id = 2;
  string member_id = 3;
}

message SyncGroupResponse {
  repeated PartitionAssignment assignment = 1;
}

message HeartbeatRequest {
  string group = 1;
  int64 generation_id = 2;
  string member_id = 3;
}

message HeartbeatResponse {}

message CommitOffsetRequest {
  string group = 1;
  int64 generation_id = 2;
  string member_id = 3;
  string topic = 4;
  int32 partition = 5;
  // The committed offset is the NEXT offset to consume.
  uint64 offset = 6;
}

message CommitOffsetResponse {}

message GetOffsetsRequest {
  string group = 1;
  string topic = 2;
  repeated int32 partitions = 3; // empty = all partitions of the topic
}

message OffsetInfo {
  int32 partition = 1;
  bool committed = 2;  // false when no commit exists for the partition
  uint64 offset = 3;
}

message GetOffsetsResponse {
  repeated OffsetInfo offsets = 1;
}

message DescribeGroupRequest {
  string group = 1;
}

message GroupMember {
  string member_id = 1;
  repeated PartitionAssignment assignment = 2;
}

message DescribeGroupResponse {
  int64 generation_id = 1;
  repeated GroupMember members = 2;
}

message CreateTopicRequest {
  string name = 1;
  // Partition count is fixed at creation; resizing is not supported.
  int32 partition_count = 2;
}

message CreateTopicResponse {}

message TopicInfo {
  string name = 1;
  int32 partition_count = 2;
}

message ListTopicsRequest {}

message ListTopicsResponse {
  repeated TopicInfo topics = 1;
}

message DescribeTopicRequest {
  string name = 1;
}

message DescribeTopicResponse {
  TopicInfo topic = 1;
}
